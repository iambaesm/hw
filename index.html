<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자현황 대시보드 · 보안 로그인</title>
<style>
:root{--bg:#F2F3F1;--card:#fff;--ink:#1C2733;--muted:#7C8794;--line:#E3E6E2;--accent:#F37321;--red:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}
.lock{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px rgba(28,39,51,.10);overflow:hidden}
.head{background:var(--ink);color:#fff;padding:26px 28px 22px}
.badge{display:inline-block;font-size:12px;font-weight:800;background:rgba(243,115,33,.18);color:#FFAA72;border:1px solid rgba(243,115,33,.45);border-radius:999px;padding:5px 9px;margin-bottom:12px}
h1{font-size:21px;letter-spacing:-.03em}
.head p{font-size:13px;color:#AAB4BE;margin-top:7px;line-height:1.55}
.body{padding:26px 28px 28px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
.pwrow{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(243,115,33,.10)}
button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 18px;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{min-height:20px;font-size:12px;margin-top:9px;color:var(--muted)}
.msg.err{color:var(--red);font-weight:700}
.note{border-top:1px solid var(--line);margin-top:17px;padding-top:14px;font-size:11px;color:var(--muted);line-height:1.6}
.spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="lock">
  <div class="head">
    <span class="badge">ENCRYPTED DASHBOARD</span>
    <h1>투자현황 대시보드</h1>
    <p>암호화된 파일입니다. 비밀번호 입력 후 대시보드를 열 수 있습니다.</p>
  </div>
  <div class="body">
    <label for="pw">비밀번호</label>
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 입력" autofocus>
      <button id="unlock"><span class="spinner" id="spin"></span>열기</button>
    </div>
    <div id="msg" class="msg">비밀번호는 이 파일에 평문으로 저장되지 않습니다.</div>
    <div class="note">AES-256-GCM · PBKDF2-SHA256 (300,000 iterations)<br>※ 복호화 후에는 브라우저 메모리에서 대시보드 데이터가 표시됩니다. 사용 후 창을 닫아주세요.</div>
  </div>
</div>

const ITERATIONS = 300000;

function b64ToBytes(s) {
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function decryptWithPassword(password) {
  if (!window.crypto || !window.crypto.subtle) throw new Error('이 브라우저에서는 Web Crypto를 사용할 수 없습니다. HTTPS 또는 최신 브라우저에서 열어주세요.');
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64ToBytes(SALT), iterations:ITERATIONS, hash:'SHA-256'},
    material,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(IV)}, key, b64ToBytes(CIPHERTEXT));
  return new TextDecoder('utf-8').decode(plain);
}
const pw = document.getElementById('pw');
const btn = document.getElementById('unlock');
const msg = document.getElementById('msg');
const spin = document.getElementById('spin');
async function unlock() {
  const value = pw.value;
  if (!value) { msg.className='msg err'; msg.textContent='비밀번호를 입력해주세요.'; pw.focus(); return; }
  btn.disabled=true; pw.disabled=true; spin.style.display='inline-block'; msg.className='msg'; msg.textContent='복호화 중…';
  try {
    const page = await decryptWithPassword(value);
    document.open(); document.write(page); document.close();
  } catch(e) {
    btn.disabled=false; pw.disabled=false; spin.style.display='none';
    msg.className='msg err';
    msg.textContent = String(e && e.message || '').includes('Web Crypto') ? e.message : '비밀번호가 올바르지 않습니다.';
    pw.select(); pw.focus();
  }
}
btn.addEventListener('click', unlock);
pw.addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
