<title>기업금융 투자현황 · PC · 암호화</title>
<style>
:root{--nav:#182430;--accent:#F37321;--bg:#F2F3F1;--ink:#1C2733;--muted:#77828E;--line:#DDE2DE}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}
.lock{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 10px 32px rgba(24,36,48,.10)}
.mark{width:44px;height:44px;border-radius:12px;background:var(--nav);display:grid;place-items:center;margin-bottom:16px;color:#fff;font-size:22px}
h1{font-size:1.18rem;margin:0 0 6px;font-weight:850}
.sub{font-size:.82rem;color:var(--muted);line-height:1.55;margin-bottom:18px}
label{display:block;font-size:.78rem;font-weight:800;margin-bottom:7px}
input{width:100%;height:46px;border:1px solid #CCD3CE;border-radius:10px;padding:0 13px;font:inherit;outline:none;background:#fff}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(243,115,33,.12)}
button{width:100%;height:46px;margin-top:10px;border:0;border-radius:10px;background:var(--nav);color:#fff;font:inherit;font-weight:800;cursor:pointer}
button:hover{background:#223449}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:10px;font-size:.76rem;color:#B33A2B;line-height:1.45}
.foot{margin-top:16px;padding-top:14px;border-top:1px solid #EDF0ED;font-size:.68rem;color:#8A949E;line-height:1.5}
</style>
</head>
<body>
<div class="lock">
  <div class="mark">🔒</div>
  <h1>기업금융 투자현황 · PC</h1>
  <div class="sub">암호화된 사내 자료입니다. 비밀번호를 입력하면 브라우저에서 복호화되어 대시보드가 열립니다.</div>
  <form id="unlockForm">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">대시보드 열기</button>
    <div class="err" id="err">비밀번호가 올바르지 않거나 파일이 손상되었습니다.</div>
  </form>

const SALT="sg3WFEf09Qs0HrXdaiScZA==";
const IV="nSa2bBoq5+ko3dQE";
const ITER=250000;

const toBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById("unlockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.style.display = "none";
  btn.disabled = true;
  btn.textContent = "복호화 중...";

  try {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: toBytes(SALT),
        iterations: ITER,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const plainBuffer = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: toBytes(IV) },
      key,
      toBytes(CIPHER)
    );

    const html = new TextDecoder("utf-8").decode(plainBuffer);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.style.display = "block";
    btn.disabled = false;
    btn.textContent = "대시보드 열기";
    document.getElementById("pw").select();
  }
});
</script>
