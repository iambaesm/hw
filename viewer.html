<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>자산운용 Dashboard</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;background:#F2F3F1;color:#1C2733}#shell{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}#bar{min-height:46px;background:#182430;color:#fff;display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}#title{font-size:.86rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}#close{border:1px solid rgba(255,255,255,.18);background:#2A3A4B;color:#fff;border-radius:8px;height:30px;padding:0 10px;font:inherit;font-size:.72rem;font-weight:800}#frame{display:none;flex:1;width:100%;border:0;background:#fff}#status{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:#56616d}#status b{display:block;font-size:.92rem;margin-bottom:6px}#status span{font-size:.78rem;line-height:1.5}.mainLink{display:inline-block;margin-top:14px;color:#F37321;font-weight:800;text-decoration:none;font-size:.78rem}</style></head><body><div id="shell"><div id="bar"><div id="title">대시보드 여는 중…</div><button id="close" type="button">닫기</button></div><div id="status"><div><b>암호화된 대시보드를 여는 중…</b><span>메인 Dashboard의 로그인 세션을 확인하고 있습니다.</span></div></div><iframe id="frame" title="상세 대시보드"></iframe></div><script>
const qs=new URLSearchParams(location.search),token=qs.get("token")||"",requestedTitle=qs.get("title")||"대시보드";let expectedSessionId="",ended=false;const status=document.getElementById("status"),frame=document.getElementById("frame"),titleEl=document.getElementById("title");
function addBase(html){if(/<base\b/i.test(html))return html;const base=new URL("./",location.href).href;return /<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,'<head$1><base href="'+base+'">'):'<base href="'+base+'">'+html}
function endSession(msg){if(ended)return;ended=true;expectedSessionId="";try{frame.srcdoc=""}catch(_){}frame.style.display="none";status.style.display="grid";status.innerHTML='<div><b>로그인 세션이 종료되었습니다.</b><span>'+(msg||'메인 Dashboard에서 다시 로그인해 주세요.')+'</span><br><a class="mainLink" href="./">메인 Dashboard 열기</a></div>';titleEl.textContent="세션 종료"}
function showError(msg){frame.style.display="none";status.style.display="grid";status.innerHTML='<div><b>대시보드를 열지 못했습니다.</b><span>'+(msg||'메인 Dashboard에서 다시 시도해 주세요.')+'</span><br><a class="mainLink" href="./">메인 Dashboard 열기</a></div>';titleEl.textContent="오류"}
window.addEventListener("message",e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.token&&d.token!==token)return;if(d.type==="viewer-content"){expectedSessionId=d.sessionId||"";titleEl.textContent=d.title||requestedTitle;frame.srcdoc=addBase(d.html||"");status.style.display="none";frame.style.display="block";return}if(d.type==="viewer-error"){showError(d.message);return}if(d.type==="viewer-logout"||d.type==="viewer-parent-closing")endSession("메인 Dashboard의 로그인 세션이 종료되었습니다.")});
function checkParent(){if(ended)return;try{if(!window.opener||window.opener.closed){endSession("메인 Dashboard 탭이 닫혔습니다.");return}if(expectedSessionId&&window.opener.__HWGI_SESSION_ID!==expectedSessionId)endSession("메인 Dashboard의 로그인 세션이 변경되었거나 종료되었습니다.")}catch(_){endSession("메인 Dashboard의 로그인 세션을 확인할 수 없습니다.")}}
document.getElementById("close").addEventListener("click",()=>{try{window.close()}catch(_){}});
if(!token||!window.opener)showError("이 화면은 메인 Dashboard에서 메뉴를 눌러 열어 주세요.");else{titleEl.textContent=requestedTitle;try{window.opener.postMessage({type:"viewer-ready",token},location.origin)}catch(_){showError("메인 Dashboard와 연결할 수 없습니다.")}}
setInterval(checkParent,1500);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkParent()});
</script></body></html>
