name: Daily Company News

on:
  schedule:
    # 22:30 UTC = 다음 날 07:30 KST
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-company-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-company-news-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r telegram-company-news-bot/requirements.txt

      - name: Send Telegram digest
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram-company-news-bot/newsbot.py
