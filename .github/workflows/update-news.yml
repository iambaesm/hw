name: Update asset market news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements-news.txt

      - name: Update encrypted market news
        env:
          NEWS_DATA_KEY_B64: ${{ secrets.NEWS_DATA_KEY_B64 }}
        run: python update_news.py

      - name: Commit changes
        run: |
          if git diff --quiet -- news.enc.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.enc.json
          git commit -m "Update asset market news"
          git push
